<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Trash</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { justify-content: center; align-items: center; background: #0F4C81; }
        .login-card { background: white; padding: 40px; border-radius: 18px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .login-card h2 { color: #0F4C81; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-family: 'Poppins', sans-serif; }
        .btn-login { width: 100%; padding: 12px; background: #00C897; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-login:hover { background: #00a87d; }
        #loginError { color: #e53935; font-size: 14px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Smart Trash IoT</h2>
        <div id="loginError">Email atau password salah!</div>
        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="admin@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn-login" id="btnSubmit">Login Dashboard</button>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnSubmit");
            const err = document.getElementById("loginError");
            
            btn.innerHTML = "Memeriksa...";
            err.style.display = "none";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                // Tembak API Backend ke URL Render
                const response = await fetch("https://don-aged-meanwhile-buying.trycloudflare.com/api/trash", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    // Simpan token ke localStorage sebagai tanda sudah login
                    localStorage.setItem("iot_token", result.token);
                    window.location.href = "index.html"; // Alihkan ke dashboard
                } else {
                    err.innerHTML = result.message || "Email atau password salah";
                    err.style.display = "block";
                    btn.innerHTML = "Login Dashboard";
                }
            } catch (error) {
                err.innerHTML = "Gagal terhubung ke server.";
                err.style.display = "block";
                btn.innerHTML = "Login Dashboard";
            }
        });
    </script>
</body>
</html>
